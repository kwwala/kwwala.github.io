<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      (function () {
        const path = window.location.pathname;

        if (path.includes(".")) {
          return;
        }

        const route = `${path}${window.location.search}${window.location.hash}`;
        const target = `${window.location.origin}/?__gh_route=${encodeURIComponent(route)}`;

        window.location.replace(target);
      })();
    </script>
  </body>
</html>
